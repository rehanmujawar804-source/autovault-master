services:
  postgres:
    image: postgres:16-alpine
    container_name: autovault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autovault}
      POSTGRES_USER: ${POSTGRES_USER:-autovault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autovault_dev_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-autovault} -d $${POSTGRES_DB:-autovault}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - autovault-network

  minio:
    image: minio/minio:latest
    container_name: autovault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - autovault-network

networks:
  autovault-network:
    name: autovault-dev-network
    driver: bridge

volumes:
  postgres_data:
    name: autovault_postgres_data
  minio_data:
    name: autovault_minio_data
